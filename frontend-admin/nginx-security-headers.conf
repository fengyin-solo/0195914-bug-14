# 安全响应头 —— 入口页面与各类静态资源共用同一套规则，
# 通过 include 引入到 server 及每个 location，避免某级 location
# 自定义 add_header 后不再继承上级头域（nginx add_header 继承规则）。
# always：即使 4xx/5xx/304 等响应也携带，同一地址的响应保持一致。
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
