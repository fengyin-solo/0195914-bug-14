server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    # ------------------------------------------------------------------
    # 统一规则（入口页面与所有静态资源遵守同一套判定标准）：
    # 默认“不直接使用本地缓存”，每次都带条件请求向服务器校验，
    # 内容未变返回 304、内容更新立即拿到新版本，反复访问同一地址结果一致。
    # 安全响应头同样在 server 级统一定义，对所有未自行声明 add_header 的
    # location 生效，避免脚本、样式、字体、图片等地址漏掉入口页面上的安全头。
    # ------------------------------------------------------------------
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;

    # 唯一例外：Vite 构建产物（/assets/ 下文件名带内容哈希），
    # 内容随地址固化、不可变，可长期本地缓存且无需再校验。
    # 注意：nginx 的 add_header 不跨配置块继承，本块一旦自行声明响应头，
    # 必须连同安全头片段一起重新 include，保证安全头与入口页面完全一致。
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA 路由支持：先找真实文件/目录，找不到再回退入口页面。
    # 回退到 /index.html 的内部重定向与直接访问入口页面走同一套规则，
    # 可访问地址与回退表现均保持不变。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
