server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 所有响应（含错误响应）统一携带安全响应头
    include /etc/nginx/snippets/security-headers.conf;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    # 带内容哈希的构建产物（js/css/字体/图片等）：文件名随内容变化，
    # 可长期强缓存且 immutable，换版后新文件名天然不会命中旧缓存。
    # 仅对成功响应附加该缓存头，404 等错误响应不被长期缓存。
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA 路由支持：
    # 真实存在的文件（如 favicon.svg）直接返回，其余地址一律回退到入口页，
    # 回退行为与此前保持一致。
    location / {
        # 入口页面及未带哈希的文件：不直接使用本地缓存，
        # 每次先与服务器校验（未变更返回 304），换版后可立即拿到新页面，
        # 新页面再引用新的哈希资源名，不会停留在旧界面。
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
